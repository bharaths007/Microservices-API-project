spring.kafka.bootstrap-servers=localhost:9092

app.kafka.topics.api=user-events-api
app.kafka.topics.batch=user-events-batch

# API flow should run with high throughput and low processing latency.
app.kafka.consumer.api.group-id=mail-consumer-api
app.kafka.consumer.api.concurrency=15
app.kafka.consumer.api.max-poll-records=500
app.kafka.consumer.api.max-poll-interval-ms=300000
app.kafka.consumer.api.session-timeout-ms=15000
app.kafka.consumer.api.heartbeat-interval-ms=5000

# Batch flow is isolated with separate consumer settings.
app.kafka.consumer.batch.group-id=mail-consumer-batch
app.kafka.consumer.batch.concurrency=5
app.kafka.consumer.batch.max-poll-records=1000
app.kafka.consumer.batch.max-poll-interval-ms=900000
app.kafka.consumer.batch.session-timeout-ms=30000
app.kafka.consumer.batch.heartbeat-interval-ms=10000
